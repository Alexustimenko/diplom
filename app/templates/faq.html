<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Часто задаваемые вопросы</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #FAF7E7;
    margin: 0;
    padding: 40px 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #CF1B03;
}

.faq-item {
    background: #fff;
    margin-bottom: 10px;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.faq-question {
    padding: 16px 20px;
    cursor: pointer;
    font-weight: bold;
    background: #ffffff;
    color: #CF1B03; /* цвет вопроса */
    transition: 0.2s;
}

.faq-question:hover {
    background: #fdf2ee;
}

.faq-answer {
    padding: 15px 20px;
    display: none;
    border-top: 1px solid #ddd;
    background: #fff;
    color:black;
}

.home-btn {
    display: block;
    margin: 40px auto 0;
    width: 200px;
    text-align: center;
    padding: 12px;
    background: #CF1B03; /* цвет кнопки */
    color: #ffffff; /* белый текст */
    text-decoration: none;
    border-radius: 6px;
    transition: 0.2s;
}

.home-btn:hover {
    opacity: 0.9;
}
</style><link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='legacy-unify.css') }}">
</head>
<body>{% include "site/_legacy_header.html" %}

<div class="container">
<h1>Часто задаваемые вопросы</h1>

<div id="faq-container"></div>

<a href="/" class="home-btn">На главную</a>
</div>

<script>
const faqData = [
{q:"Подойдёт ли кресло для работы по 8–10 часов?",a:"Да, если есть эргономичная спинка, поясничная поддержка и синхромеханизм."},
{q:"Какой механизм стоит — топ-ган или синхро?",a:"Указано в характеристиках; синхро комфортнее для долгой работы."},
{q:"Есть ли регулировка глубины сиденья?",a:"Есть только у моделей среднего и высокого класса."},
{q:"Насколько прочная крестовина?",a:"Металлическая прочнее пластиковой."},
{q:"Подходит ли кресло для людей ростом 185–195 см?",a:"Да, если высокая спинка и регулируемый подголовник."},
{q:"Не будет ли жарко летом?",a:"Сетчатая спинка лучше всего вентилируется."},
{q:"Какой максимальный вес выдерживает?",a:"Обычно 120–150 кг, зависит от модели."},
{q:"Скрипит ли кресло со временем?",a:"При правильной сборке — нет; скрип чаще из-за креплений."},
{q:"Есть ли регулировка подлокотников 3D/4D?",a:"Указывается в карточке; 4D встречается в среднем сегменте."},
{q:"Можно ли фиксировать наклон спинки?",a:"Да, у моделей с синхромеханизмом или мультиблоком."},
{q:"Какой газлифт установлен?",a:"Чаще всего класс 2–3."},
{q:"Подходит ли кресло для подростка?",a:"Да, если минимальная высота сиденья позволяет поставить ноги на пол."},
{q:"Есть ли запах у нового кресла?",a:"Лёгкий запах возможен первые 1–2 дня."},
{q:"Можно ли заменить колёса на мягкие?",a:"Да, большинство кресел используют стандартный шток 11 мм."},
{q:"Подойдёт ли кресло для ламината?",a:"Да, но лучше использовать полиуретановые колёса."},
{q:"Насколько плотная сетка на спинке?",a:"Указывается в характеристиках; плотная служит дольше."},
{q:"Есть ли поясничная поддержка?",a:"У большинства моделей — встроенная или регулируемая."},
{q:"Можно ли собрать кресло самому?",a:"Да, сборка занимает 10–20 минут."},
{q:"Какой вес у кресла?",a:"Обычно 12–18 кг."},
{q:"Подходит ли кресло для геймеров?",a:"Да, если есть высокая спинка и подголовник."},
{q:"Насколько мягкое сиденье?",a:"Зависит от плотности поролона; чаще средняя жёсткость."},
{q:"Можно ли откидываться назад?",a:"Да, если есть механизм качания или синхро."},
{q:"Не проваливается ли сиденье со временем?",a:"У качественных моделей — нет."},
{q:"Как ухаживать за тканью?",a:"Пылесос + мягкие чистящие средства."},
{q:"Есть ли подставка под ноги?",a:"Редко; только у отдельных моделей."},
{q:"Насколько тихо работают колёса?",a:"Полиуретановые — тихие, пластиковые — громче."},
{q:"Можно ли снять подлокотники?",a:"У некоторых моделей — да."},
{q:"Есть ли гарантия?",a:"Обычно 12 месяцев."},
{q:"Как быстро доставляют?",a:"Обычно 1–5 дней, зависит от склада."},
{q:"Подойдёт ли кресло для стола с регулировкой высоты?",a:"Да, если диапазон газлифта позволяет настроить посадку."},
{
  q: "Руководство пользователя",
  a: '<a href="https://docs.google.com/document/d/1Df1UM_sD2i058jP1GUnkh_mrwFJEPran/edit?usp=sharing&ouid=113011124616926993755&rtpof=true&sd=true" target="_blank">Открыть руководство пользователя</a>'
}
];

const container = document.getElementById("faq-container");

faqData.forEach(item => {
    const block = document.createElement("div");
    block.className = "faq-item";

    const question = document.createElement("div");
    question.className = "faq-question";
    question.textContent = item.q;

    const answer = document.createElement("div");
    answer.className = "faq-answer";
    answer.innerHTML = item.a;

    question.addEventListener("click", () => {
        answer.style.display = answer.style.display === "block" ? "none" : "block";
    });

    block.appendChild(question);
    block.appendChild(answer);
    container.appendChild(block);
});
</script>

{% include "site/_legacy_footer.html" %}</body>
</html>
