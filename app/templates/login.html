<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { background-color: #33CCCC; font-family: Arial, sans-serif; }
        .container {
            width: 400px;
            margin: 120px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        h2 { text-align: center; color: #FF7400; }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border: 2px solid #33CCCC;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 16px;
            background-color: #FF7400;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .error { margin-top: 12px; color: red; text-align: center; }
        .link { margin-top: 14px; text-align: center; }
        .link a { color: #33CCCC; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Вход</h2>

    <form method="POST">
        <input type="text" name="email" placeholder="Email или admin" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <div class="link">
        <a href="/register">Нет аккаунта? Регистрация</a>
    </div>
</div>

</body>
</html>
