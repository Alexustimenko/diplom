<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
body { background-color: #FAF7E7; font-family: Arial, sans-serif; }

.container {
    width: min(400px, calc(100% - 24px));
    margin: 100px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
}

h2 { text-align: center; color: #CF1B03; }

.container input, .container select, .container button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: 2px solid #CF1B03;
    border-radius: 6px;
    box-sizing: border-box; /* ← вот это делает одинаковую ширину */
    font-size: 14px;
}

/* select чуть выравниваем по высоте */
.container select {
    appearance: none;
}

/* кнопка */
.container button {
    margin-top: 15px;
    background-color: #CF1B03;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.container button:disabled {
    background-color: #ccc;
    cursor: not-allowed;
}

.container button:hover:not(:disabled) {
    opacity: 0.9;
}

.hidden { display: none; }

.checkbox-block {
    margin-top: 15px;
    font-size: 14px;
}

.checkbox-block input {
    width: auto;
    margin-right: 6px;
}

.link { margin-top: 14px; text-align: center; }
.link a { color: #CF1B03; font-weight: bold; text-decoration: none; }
</style><link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='legacy-unify.css') }}">
</head>
<body>{% include "site/_legacy_header.html" %}

<div class="container auth-container">
    <h2>Регистрация</h2>

    <form method="POST">

        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>

        <select name="customer_type" id="customerType" onchange="toggleFields()">
            <option value="fiz">Физическое лицо</option>
            <option value="ur">Юридическое лицо</option>
        </select>

        <!-- Блок для юрлица -->
        <div id="urFields" class="hidden">
            <input type="text"
                   name="company_name"
                   placeholder="Наименование организации">

            <input type="text"
                   name="unp"
                   maxlength="9"
                   pattern="\d{9}"
                   title="УНП должен содержать 9 цифр"
                   placeholder="УНП (9 цифр)">
        </div>

        <!-- Политики -->
        <div class="link">
            <p>
                <a  class="link" href="https://docs.google.com/document/d/1Sn1ueJjTrQ9D1X4q3lCoBXLmicX39yHG/edit?usp=sharing"
                   target="_blank">
                    Политика в отношении обработки персональных данных
                </a>
            </p>

            <p>
                <a class="link" href="https://docs.google.com/document/d/1sMFEzDyE_lyDwxY1JiOn6sN9wUe8vh5Q/edit?usp=sharing"
                   target="_blank">
                    Правила модерации и политика этичного общения
                </a>
            </p>
        </div>

        <!-- Чекбокс согласия -->
        <div class="checkbox-block">
            <label>
                <input type="checkbox" id="agreeCheckbox" onchange="toggleButton()">
                Я ознакомился(лась) и принимаю условия
            </label>
        </div>

        <button type="submit" id="registerBtn" disabled>
            Зарегистрироваться
        </button>

    </form>

    <!-- Ссылка на вход -->
    <div class="link">

        <a class="link" href="/login">Уже есть аккаунт? Войти</a>
    </div>

</div>

<script>
function toggleFields() {
    const type = document.getElementById("customerType").value;
    const block = document.getElementById("urFields");

    if (type === "ur") {
        block.classList.remove("hidden");
        block.querySelectorAll("input").forEach(i => i.required = true);
    } else {
        block.classList.add("hidden");
        block.querySelectorAll("input").forEach(i => i.required = false);
    }
}

function toggleButton() {
    const checkbox = document.getElementById("agreeCheckbox");
    const button = document.getElementById("registerBtn");

    button.disabled = !checkbox.checked;
}
</script>

{% include "site/_legacy_footer.html" %}</body>
</html>
